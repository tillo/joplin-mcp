include:
  - project: mdapi/ci-templates
    file: /notify.yml
    ref: main
  - project: mdapi/ci-templates
    file: /secret-scan.yml
    ref: main
  - project: mdapi/ci-templates
    file: /scan.yml
    ref: main

stages:
  - build
  - scan
  - notify

buildkit:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/moby/buildkit:rootless
    entrypoint: [""]
  stage: build
  tags:
    - mdapi
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    CACHE_IMAGE: $CI_REGISTRY_IMAGE:cache
  # ⛔⛔ This job used to publish :latest from EVERY pipeline, branches included —
  # it had no `rules:` at all. Combined with a Deployment on `imagePullPolicy:
  # Always` + Keel `policy: force`, that made a plain `git push` of any branch a
  # PRODUCTION DEPLOY, with neither merge nor review in the path.
  #
  # Demonstrated on mdapi/keycloak 2026-09-22: pipeline 35876, on an unmerged
  # branch, published :latest and the running pod picked it up about ten minutes
  # BEFORE the MR was merged.
  #
  # ⭐ The build still runs everywhere — losing MR validation would be a real cost
  # and the build is what catches a broken Dockerfile. Only the TAG SET is
  # conditional: the floating tag Keel deploys from is minted on the default
  # branch only, while branches and MRs publish just the immutable SHA tag.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        IMAGE_TAGS: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA,$CI_REGISTRY_IMAGE:latest"
    - when: on_success
      variables:
        IMAGE_TAGS: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  before_script:
    - mkdir -p ~/.docker
    - |
      echo "{
        \"auths\": {
          \"${CI_REGISTRY}\": {
            \"auth\": \"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"
          },
          \"$(echo -n $CI_DEPENDENCY_PROXY_SERVER | awk -F[:] '{print $1}')\": {
            \"auth\": \"$(printf "%s:%s" ${CI_DEPENDENCY_PROXY_USER} "${CI_DEPENDENCY_PROXY_PASSWORD}" | base64 | tr -d '\n')\"
          }
        }
      }" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --export-cache type=registry,ref=$CACHE_IMAGE \
        --import-cache type=registry,ref=$CACHE_IMAGE \
        --opt platform=linux/amd64 \
        --opt build-arg:CACHEBUST_DAY=$(date +%Y%m%d) \
        --opt build-arg:REGISTRY=$(echo "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}" | sed "s|:443||")/ \
        --progress=plain \
        --output type=image,\"name=${IMAGE_TAGS}\",push=true \
        > build.log 2>&1 || EXIT_CODE=$?
      cat build.log
      exit ${EXIT_CODE:-0}
  artifacts:
    when: always
    paths:
      - build.log
    expire_in: 7 days

# CVE scan via the shared job in mdapi/ci-templates (scan.yml):
# pinned grype + sha256, registry auth, and notifies only for
# HIGH/CRITICAL that actually have a fix.
scan:
  extends: .grype-scan

notify-success:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:latest
  stage: notify
  tags:
    - mdapi
  variables:
    GIT_DEPTH: "5"
  rules:
    - when: never
  before_script:
    - apk add --no-cache git curl python3
  script:
    - |
      REASON=$(python3 - <<'PYEOF'
      import re
      try:
          content = open('build.log').read()
      except FileNotFoundError:
          exit()
      steps = {}
      for m in re.finditer(r'^#(\d+) \[(\d+/\d+)\] (.+)$', content, re.MULTILINE):
          steps[m.group(1)] = m.group(3).strip()
      cached = set(re.findall(r'^#(\d+) CACHED', content, re.MULTILINE))
      changed = [label for num, label in sorted(steps.items(), key=lambda x: int(x[0])) if num not in cached]
      if changed:
          print('\n'.join(changed))
      PYEOF
      )
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ -z "$REASON" ]; then
        echo "All layers cached on scheduled run — nothing changed, skipping notification"
        exit 0
      fi
      MSG=$(printf '%s:%s' "$CI_REGISTRY_IMAGE" "$CI_COMMIT_SHORT_SHA")
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        if [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
          CHANGES=$(git log --oneline -5 2>/dev/null || true)
        else
          CHANGES=$(git log --oneline "${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}" 2>/dev/null || true)
        fi
        [ -n "$CHANGES" ] && MSG=$(printf '%s\n\nGit changes:\n%s' "$MSG" "$CHANGES")
      fi
      [ -n "$REASON" ] && MSG=$(printf '%s\n\nRebuilt layers:\n%s' "$MSG" "$REASON")
      curl -sf \
        --form-string "token=$PUSHOVER_API_TOKEN" \
        --form-string "user=$PUSHOVER_USER_KEY" \
        --form-string "title=Joplin MCP: new image pushed" \
        --form-string "message=$MSG" \
        https://api.pushover.net/1/messages.json || echo "pushover notify failed (non-fatal)"

notify-failure:
  extends: .notify-failure
secret-scan:
  extends: .secret-scan
