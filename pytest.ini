[pytest]
# CI runs `python -m pytest -q tests`; this file is what tells crapper and
# mutator to run pytest too. Without it they fall back to unittest, which
# collects none of these pytest-style tests ("NO TESTS RAN", infra-ik4p.23).
testpaths = tests
# The project root goes on sys.path from here, not from tests/../ : mutator runs each
# mutant in an overlay whose tests/ is a symlink, and tests/.. resolves through it
# to the real tree, so every mutant would be tested against the unmutated module.
pythonpath = .
